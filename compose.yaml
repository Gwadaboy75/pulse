# Pulse and its Postgres. See docs/setup.md. Set POSTGRES_PASSWORD and BETTER_AUTH_SECRET in .env.
services:
  db:
    image: postgres:18-alpine
    container_name: pulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulse
      POSTGRES_DB: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Small buffers for a home server; Pulse is one app with a pool of 10.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    mem_limit: 256m
    volumes:
      # Postgres 18's image keeps its data in a versioned directory under /var/lib/postgresql.
      - pulse-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No ports: only the app reaches it, over the compose network.

  pulse:
    build: .
    image: pulse:latest
    container_name: pulse
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://pulse:${POSTGRES_PASSWORD}@db:5432/pulse
      DOCUMENTS_DIR: /app/data/documents
    volumes:
      # Uploaded medical documents (Médical › Documents): a named volume, backed up beside the database (docs/admin.md).
      - pulse-docs:/app/data/documents
    depends_on:
      db:
        condition: service_healthy
    # Uses ~100-150 MB. The V8 heap is 50% of this limit (Dockerfile), so raising it grows the heap too.
    mem_limit: 384m
    # No ports by default: a tunnel or reverse proxy in Docker reaches http://pulse:3000 over a shared network. To reach
    # it from the host (a tunnel or proxy running outside Docker), publish one in compose.override.yaml (docs/setup.md).

volumes:
  pulse-pg:
  pulse-docs:
